<head>

    <style>
        @media (min-width: 900px) {
        body {
            background-color: whitesmoke;
        }

        h1 {
            font-size: 4.5vw;

            margin-top: 0.2%;
        }

        .hr1 {
            border: black, 0.01vw, solid;

        #hako {
            text-align: center;
            margin-top: 13%;
            font-size: 3vw;

            }

            }
